name: Android Play Store (AAB) & Debug (APK) Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Play Store AAB & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, initializing platform..."
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew

      - name: Build Android AAB (Play Store) and APK (Test)
        working-directory: ./android
        run: |
          echo "Building Release App Bundle (AAB) and Debug APK..."
          ./gradlew bundleRelease assembleDebug --stacktrace

          echo "Generating Google Play upload signing keystore..."
          keytool -genkeypair -v \
            -keystore ../smarttools-upload-keystore.jks \
            -alias smarttools \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "smarttools2026" \
            -keypass "smarttools2026" \
            -dname "CN=Smart Utility Tools, OU=Mobile, O=Smart Utility Tools, L=Dhaka, ST=Dhaka, C=BD"

          AAB_FILE=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "Signing Google Play Store AAB: $AAB_FILE"
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore ../smarttools-upload-keystore.jks \
              -storepass "smarttools2026" \
              -keypass "smarttools2026" \
              "$AAB_FILE" smarttools
            echo "AAB successfully signed for Google Play Store upload!"
          fi

          echo "Saved files summary:"
          ls -lh app/build/outputs/bundle/release/*.aab || true
          ls -lh app/build/outputs/apk/debug/*.apk || true

      - name: Upload Google Play Store AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Test APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Play Store Keystore (Save for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-upload-keystore
          path: smarttools-upload-keystore.jks
          if-no-files-found: warn
