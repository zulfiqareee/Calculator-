name: Android Play Store (AAB) & Debug (APK) Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Play Store AAB & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found, initializing platform..."
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew

      - name: Decode Upload Keystore (Protected Branches / Signed Builds)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            chmod 600 "$RUNNER_TEMP/upload-keystore.jks"
            echo "Keystore decoded to temporary runner directory."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set; skipping release keystore decode."
          fi

      - name: Build Android AAB (Play Store) and Debug APK
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -f "$ANDROID_KEYSTORE_PATH" ] && [ -n "$ANDROID_KEYSTORE_PASS" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASS" ]; then
            echo "Building Signed Release App Bundle (AAB) and Debug APK..."
            ./gradlew bundleRelease assembleDebug --stacktrace
          else
            echo "Signing secrets not configured (e.g. PR or first-time setup); building Debug APK and unsigned Release AAB..."
            ./gradlew bundleRelease assembleDebug --stacktrace
          fi

          ls -lh app/build/outputs/bundle/release/*.aab || true
          ls -lh app/build/outputs/apk/debug/*.apk || true

      - name: Cleanup Keystore Material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload Google Play Store AAB (App Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Test APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
