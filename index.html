    <script>
      // Suppress benign Vite dev WebSocket disconnection noise in sandbox
      (function() {
        var isWsError = function(str) {
          if (!str || typeof str !== 'string') return false;
          return str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('closed without opened') !== -1 ||
                 str.indexOf("reading 'send'") !== -1 ||
                 str.indexOf('[vite]') !== -1;
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg) {
              var s = String(arg.message || arg.stack || arg);
              if (isWsError(s)) return;
            }
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = String((e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '');
          if (isWsError(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && (e.reason || '');
          var msg = String(reason.message || reason.stack || reason);
          if (isWsError(msg)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
